<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>产品连接 · Fast-browser-link</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="product-connections.css" />
  </head>
  <body>
    <main class="connection-settings">
      <header class="page-header">
        <div class="brand-lockup">
          <img src="brand-logo-small.svg" width="20" height="20" alt="" /><span
            >Fast-browser-link</span
          >
        </div>
        <h1 data-copy="title">产品连接</h1>
        <p data-copy="intro">在本机将已加载的 Fast-Backlink 连接到 FBL。</p>
      </header>
      <form id="pair-form" novalidate>
        <label for="extension-id" data-copy="label">Fast-Backlink 扩展 ID</label>
        <p id="id-help" class="help" data-copy="help">
          从 Fast-Backlink 侧栏的连接区复制当前已加载的扩展 ID，再粘贴到这里。
        </p>
        <input
          id="extension-id"
          name="extensionId"
          type="text"
          required
          pattern="[a-p]{32}"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          aria-describedby="id-help id-rule identity-note"
        />
        <p id="id-rule" class="help" data-copy="rule">
          ID 必须是 32 位小写字母 a–p；不要填写名称或网址。
        </p>
        <p id="identity-note" class="help" data-copy="identity">
          名称不代表身份。扩展 ID 变化后，需要重新配对。
        </p>
        <button id="pair-button" class="primary" type="submit" data-copy="pair">配对产品</button>
      </form>
      <p
        id="action-status"
        class="feedback"
        role="status"
        aria-live="polite"
        tabindex="-1"
        hidden
      ></p>
      <section class="registry" aria-labelledby="registry-heading">
        <div class="section-heading">
          <h2 id="registry-heading" data-copy="registry">已登记产品</h2>
          <button id="refresh-button" type="button" data-copy="refresh">核对状态</button>
        </div>
        <p id="registry-status" role="status" aria-live="polite" data-state="loading">读取中…</p>
        <ul id="connections" aria-label="已登记产品"></ul>
      </section>
      <footer>
        <p id="unpair-help" class="help" data-copy="unpairHelp">
          解除配对会停止该产品后续控制，保留原页面和已填数据。不保证取消已派发的操作。
        </p>
      </footer>
    </main>
    <script type="module" src="product-connections-page.mjs"></script>
  </body>
</html>
