<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast-browser-link</title><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="copilot-controls.css"></head><body><main class="popup">
<header class="header"><div class="brand-lockup"><img src="brand-logo-small.svg" alt="" width="24" height="24"><strong>Fast-browser-link</strong></div><div class="header-meta"><span id="version-label" aria-label="扩展版本"></span><span id="connection-label" class="dot" role="status" aria-label="连接中" aria-live="polite" data-state="connecting"></span></div></header>

<section id="connection-card" class="empty-state sr-only" hidden=""><span class="empty-symbol" aria-hidden="true">⌁</span><p id="empty-label"></p><button id="connect" class="primary" aria-describedby="connection-detail" type="button" hidden="">连接</button></section>
<button id="popup-setup" class="summary-link" type="button" hidden="" data-zh="查看就绪清单" data-en="Readiness checklist">查看就绪清单</button><div id="popup-chains" class="compact-connections" aria-live="polite"></div><section class="connections" aria-label="连接状态"><div class="connection-row" id="local-row"><span class="row-icon" aria-hidden="true">⌘</span><span data-zh="本地连接" data-en="Local">本地连接</span><span id="access-status" class="status-component" role="status" aria-live="polite" data-state="connecting">连接中</span><button id="local-connect" class="small-button" type="button" hidden="">连接</button><span class="info"><button class="info-button" type="button" aria-label="本地连接说明" aria-describedby="connection-detail access-detail">ⓘ</button><span class="tooltip" role="tooltip"><span id="connection-detail">确认连接即允许 Fast-browser-link 直接读取、点击和执行任务页脚本，无须逐站或逐项审批。授权仅限任务页；保留接管、停止和任务隔离，密码输入值不回显。</span><span id="access-detail" aria-live="polite">连接状态待确认。</span></span></span></div><div class="connection-row" id="hermes-row"><span class="row-icon" aria-hidden="true">◇</span><span data-zh="本机 Hermes" data-en="Local Hermes">本机 Hermes</span><span id="popup-hermes-status" class="status-component" role="status"></span><button id="hermes-refresh" type="button" class="small-button" data-zh="修复" data-en="Repair">修复</button></div><section class="connection-row copilot-section"><button id="copilot-summary" class="summary-link" type="button" hidden=""></button><span id="popup-board-name">Hermes协作看板</span><button id="copilot-toggle" disabled="" class="switch" role="switch" aria-checked="false" aria-label="协作开关" type="button"><span></span></button><button id="open-copilot" class="small-button" type="button" data-zh="看板" data-en="Board" hidden="">看板</button></section>

<div class="connection-row cloud-row"><button id="cloud-expand" class="row-trigger" type="button" aria-expanded="false" aria-controls="cloud-dialog"><span class="row-icon" aria-hidden="true">☁</span><span data-zh="云端连接" data-en="Cloud">云端连接</span><span id="cloud-status" class="status-component" role="status" aria-live="polite">连接中</span></button><button id="cloud-connect" class="small-button" type="button" aria-describedby="cloud-access-detail">配对</button><span class="info"><button class="info-button" type="button" aria-label="云端连接说明" aria-describedby="cloud-access-detail cloud-detail">ⓘ</button><span class="tooltip" role="tooltip"><span id="cloud-access-detail">确认配对即允许云端直接读取、点击和填写云端任务页，无须逐站或逐项审批。已有个人标签页不授权。</span><span id="cloud-detail">状态待确认。</span></span></span></div>
<div id="cloud-dialog" class="expander" data-open="false" inert=""><div class="expand-inner"><section class="pair-panel" aria-label="云端配对"><div class="section-heading"><strong data-zh="连接到云端" data-en="Pair with cloud">连接到云端</strong><button id="cloud-dialog-close" class="icon-button" type="button" aria-label="收起配对面板">×</button></div><p id="cloud-dialog-state" class="sr-only" role="status"></p><div id="cloud-code-panel"><span class="small" data-zh="连接码" data-en="Pairing code">连接码</span><output id="cloud-code" class="connection-code"></output><div class="code-actions"><span id="cloud-code-expiry" class="small" role="status"></span><button id="cloud-copy-code" type="button">复制连接码</button></div></div><button id="cloud-open-web" type="button" data-zh="打开配对网页" data-en="Open pairing page">打开配对网页</button><div class="cloud-manage"><button id="cloud-regenerate" type="button">重新生成</button><button id="cloud-disconnect" class="danger" type="button" hidden="">断开</button></div><div id="cloud-error-bar" class="error-bar" hidden=""><span id="cloud-error" role="alert"></span><button id="cloud-error-close" type="button" class="icon-button" aria-label="关闭错误提示">×</button></div></section></div></div>
<div id="page-task" class="connection-row page-task" hidden=""><span class="row-icon" aria-hidden="true">▣</span><div class="task-copy"><span id="task-title"></span><span id="operation" class="small" role="status"></span></div><div class="page-controls"><button id="takeover" type="button">接管</button><button id="stop-task" class="danger" type="button">停止</button></div><span class="info"><button class="info-button" type="button" aria-label="任务控制说明" aria-describedby="task-info">ⓘ</button><span id="task-info" class="tooltip" role="tooltip" data-zh="只控制当前归属任务页。接管和停止须由本地桥确认；结果未知时不会自动重发。" data-en="Controls apply only to the current task page. Takeover and stop require host confirmation; uncertain commands are never replayed.">只控制当前归属任务页。接管和停止须由本地桥确认；结果未知时不会自动重发。</span></span></div>
</section><div id="error-bar" class="error-bar" hidden=""><span id="error" role="alert" hidden=""></span><button id="error-close" class="icon-button" type="button" aria-label="关闭错误提示">×</button></div></main><script type="module" src="popup.mjs"></script><script type="module" src="cloud-popup.mjs"></script>
</body></html>
