name: Release installation packages
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build immutable independent and Hermes packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          python3 scripts/package-agent.py --release "$version" --output "out/fast-browser-link-$version"
          node scripts/package-executor.mjs --release "$version" --output "out/fast-browser-link-hermes-$version"
          cd out
          zip -q -r "fast-browser-link-$version.zip" "fast-browser-link-$version"
          zip -q -r "fast-browser-link-hermes-$version.zip" "fast-browser-link-hermes-$version"
          sha256sum "fast-browser-link-$version.zip" "fast-browser-link-hermes-$version.zip" > SHA256SUMS.txt
      - name: Publish verified tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "out/fast-browser-link-$version.zip" \
            "out/fast-browser-link-hermes-$version.zip" \
            out/SHA256SUMS.txt \
            --verify-tag --title "Fast-browser-link $version" \
            --notes-file "docs/release-$version.md" --latest
