<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>协作 · Fast-browser-link</title><link rel="stylesheet" href="copilot-panel.css"></head>
<body><header><h1>协作 <span>Fast-browser-link</span></h1><label><input id="enabled" type="checkbox">开启协作</label><label><input id="ball" type="checkbox" checked>显示悬浮球</label><p id="usage">本次 Token：0</p><p id="status" role="status" aria-live="polite">正在连接本地桥…</p><button id="refresh">刷新看板</button></header>
