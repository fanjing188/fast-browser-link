<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes协作看板</title><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="copilot-panel.css"><link rel="stylesheet" href="copilot-controls.css"></head><body>
<div id="work-view"><header class="compact-toolbar"><div class="brand-lockup"><img src="brand-logo-small.svg" alt="" width="20" height="20"><span>Fast-browser-link</span><strong id="board-name" data-user-content="">Hermes协作看板</strong></div><label class="switch compact-switch"><input id="enabled" disabled="" type="checkbox" aria-label="协作开关"><span class="sr-only">协作开关</span></label><span id="status" role="status" aria-live="polite">未开启</span><button id="open-settings" type="button" class="icon-button" aria-label="设置" title="设置">⚙</button></header><div id="fbl-chains" class="compact-connections" aria-live="polite"></div><div class="compact-connections"><span>浏览器桥 <span id="bridge-status" role="status"></span></span><span>本机 Hermes <span id="hermes-status" role="status"></span><button id="hermes-retry" type="button">重试</button></span><span id="sidebar-cloud" hidden="">云端 <span id="sidebar-cloud-status"></span></span></div><section id="table-confirmation-live" aria-live="polite"></section>
<div id="balanced-notice" class="inline-notice" hidden=""><span>已用均衡模式，可在设置中调整</span><button id="dismiss-balanced" type="button" class="icon-button" aria-label="关闭提示">×</button></div>

<section id="error" class="error" role="alert" hidden=""><p id="error-copy"></p><button id="retry-session">重试</button><details><summary>详情</summary><pre id="error-code"></pre></details></section><p id="notice" class="notice" aria-live="polite"></p>
<main><details id="work-basket" class="work-basket"><summary>工作篮 · 0</summary></details><section aria-labelledby="suggestions-title"><h2 id="suggestions-title">建议 <span id="suggestions-count">0</span></h2><div id="pending"></div></section><section aria-labelledby="running-title"><h2 id="running-title">进行中 <span id="running-count">0</span></h2><div id="running"></div></section><section aria-labelledby="results-title"><h2 id="results-title">结果 <span id="results-count">0</span></h2><div id="results"></div><details id="older-results" hidden=""><summary>更早的结果</summary><div></div></details></section></main><section class="recent-logs"><button id="open-logs" type="button" class="" aria-label="日志" title="日志">日志看板 ›</button><div id="recent-logs"></div></section><div id="usage-details" class="compact-usage usage-one-line"><span id="usage-label">今日 0 tokens</span><span id="session-usage">本次 0</span></div></div><section id="settings-view" class="secondary-view" data-active="false" aria-hidden="true" inert="" aria-label="设置"><header class="view-heading"><button type="button" data-back="work">‹ 设置</button><button id="reconnect" type="button">重新连接</button></header><div class="secondary-content"><form id="copilot-settings-form">
<fieldset class="settings-group"><label class="setting" for="board-name-input"><span>看板名称 <output data-feedback="board_name" aria-live="polite"></output></span><input id="board-name-input" maxlength="80" autocomplete="off"></label><legend>界面</legend><label class="setting-row" for="ball"><span>悬浮球 <output data-feedback="show_ball" aria-live="polite"></output></span><input id="ball" type="checkbox" checked=""></label><label class="setting-row" for="selection-popup"><span>划词悬浮窗 <button type="button" class="info-button" title="每次开启协作默认重新启用划词悬浮窗。" aria-label="划词悬浮窗说明">ⓘ</button> <output data-feedback="selection_popup" aria-live="polite"></output></span><input id="selection-popup" type="checkbox" checked=""></label><label class="setting-row"><span>页面内标注 <output data-feedback="page_annotations" aria-live="polite"></output></span><input id="page-annotations" type="checkbox" checked></label><label class="setting" for="annotation-density"><span>标注密度 <output data-feedback="annotation_density" aria-live="polite"></output></span><select id="annotation-density"><option value="compact">简洁 · 档位 / 已在池</option><option value="full">完整 · 加数字 / 日期</option></select></label></fieldset>
<fieldset class="settings-group"><legend>执行模式与模型 <output data-feedback="mode" aria-live="polite"></output></legend><label class="setting-row"><span>自动执行零成本动作 <output data-feedback="auto_zero" aria-live="polite"></output></span><input id="auto-zero" type="checkbox" checked></label><div class="mode-options"><label><input type="radio" name="mode" value="saving">省钱</label><label><input type="radio" name="mode" value="balanced" checked="">均衡</label><label><input type="radio" name="mode" value="quality">高质量</label><label><input type="radio" name="mode" value="custom">自定义</label></div><div class="model-heading"><span>会话模型</span><button id="refresh-models" type="button">刷新模型</button></div><output id="models-message" class="small" role="status" aria-live="polite"></output>
<label class="setting" for="setting-inference_model"><span>推理模型 <output data-feedback="inference_model" aria-live="polite"></output></span><select id="setting-inference_model"><option value="">使用 profile 默认</option><option value="manual">手动输入模型 ID…</option></select></label><label class="setting manual-setting" for="inference_model-manual"><span class="sr-only">手动推理模型 ID</span><input id="inference_model-manual" hidden="" placeholder="provider:model" autocomplete="off" spellcheck="false"></label>
<label class="setting" for="setting-exec_model"><span>执行模型 <output data-feedback="exec_model" aria-live="polite"></output></span><select id="setting-exec_model"><option value="">使用 profile 默认</option><option value="manual">手动输入模型 ID…</option></select></label><label class="setting manual-setting" for="exec_model-manual"><span class="sr-only">手动执行模型 ID</span><input id="exec_model-manual" hidden="" placeholder="provider:model" autocomplete="off" spellcheck="false"></label></fieldset>
<details class="settings-group" id="advanced-settings"><summary>执行与性能</summary><label class="setting" for="setting-exec_transport"><span>执行通道 <button type="button" class="info-button" title="当前 ACP 不支持每会话工具/轮数控制；通用任务请选 oneshot。只影响协作会话，不改默认模型；当前任务保持原配置。" aria-label="执行通道说明">ⓘ</button><output data-feedback="exec_transport" aria-live="polite"></output></span><select id="setting-exec_transport"><option value="acp">常驻 ACP · 单轮判读</option><option value="oneshot">独立 oneshot · 可用工具</option></select></label>
<div class="settings-grid"><label class="setting" for="setting-max_parallel"><span>执行并发 <output data-feedback="max_parallel" aria-live="polite"></output></span><input id="setting-max_parallel" type="number" min="1" max="3" value="3" required=""></label><label class="setting" for="setting-context_limit"><span>上下文阈值 <output data-feedback="context_limit" aria-live="polite"></output></span><input id="setting-context_limit" type="number" min="100" max="1000000" value="6000" required=""></label><label class="setting" for="setting-turn_multiplier"><span>模板轮数倍率 <output data-feedback="turn_multiplier" aria-live="polite"></output></span><select id="setting-turn_multiplier"><option value="1">1 倍 · 默认</option><option value="2">2 倍 · 更多轮数</option></select></label></div></details>
</form><fieldset class="settings-group"><legend>表格与导出</legend><label class="setting" for="table-export-dir">导出目录<input id="table-export-dir" autocomplete="off"></label><label class="setting" for="table-max-pages">多页上限<input id="table-max-pages" type="number" min="1" max="200" value="50"></label><label class="setting" for="table-delay-min">最小页间间隔<input id="table-delay-min" type="number" min="0.5" max="60" step="0.5" value="1.5"></label><label class="setting" for="table-delay-max">最大页间间隔<input id="table-delay-max" type="number" min="0.5" max="60" step="0.5" value="3"></label><output id="preferences-feedback" aria-live="polite"></output><section id="table-tools" aria-label="页面表格"></section><section id="selected-text" hidden=""><p data-user-content=""></p><p id="selection-limit" hidden="">选区过长，请缩小到11800字内再处理。</p><button id="process-selection">处理选中文本</button></section></fieldset><details id="local-capabilities" class="settings-group"><summary>本机能力</summary><output id="capability-notice" role="status"></output><div class="capability-body"></div></details><fieldset class="settings-group"><legend>关于</legend><p id="about-version">Fast-browser-link · 2.2.0</p><p>日志目录 <code>copilot/logs</code><button type="button" class="info-button" title="位于当前 Native 实例运行目录；导出请进入日志看板。">ⓘ</button></p></fieldset><details class="settings-group"><summary>结果与用量</summary><div class="result-controls"><select id="result-filter" aria-label="筛选结果类型"><option value="">全部类型</option><option value="seo.keyword_check">查词</option><option value="seo.longtail">长尾</option><option value="seo.competitor_keywords">竞品</option><option value="seo.serp_breakdown">SERP</option><option value="seo.trends">趋势</option><option value="seo.ranking_sites">排名站点</option><option value="table.export">表格</option><option value="general.task">通用</option></select><button id="clear-read">清空已读</button></div><details id="result-history"><summary>历史结果</summary><div></div></details><dl><div><dt>输入</dt><dd id="usage-input">0</dd></div><div><dt>缓存读</dt><dd id="usage-cache_read">0</dd></div><div><dt>输出</dt><dd id="usage-output">0</dd></div></dl><div id="model-usage"></div></details></div></section>
<section id="logs-view" class="secondary-view log-view" data-active="false" aria-hidden="true" inert="" aria-label="实时日志"><header class="view-heading"><button type="button" data-back="work">‹ 日志</button><span id="log-count" class="small">0</span></header><div class="log-tools"><select id="log-filter" aria-label="日志类型"><option value="">全部</option><option value="capture">采集</option><option value="inference">推理</option><option value="execution">执行</option><option value="system">系统</option><option value="errors">仅错误</option></select><input id="log-search" type="search" placeholder="搜索日志" aria-label="搜索日志"><button id="log-pause" type="button" aria-pressed="false">暂停滚动</button><button id="log-clear" type="button">清空</button><button id="log-copy" type="button" title="复制全部JSONL">复制</button><button id="log-export" type="button" title="导出全部JSONL">导出</button></div><output id="log-notice" class="small" role="status" aria-live="polite"></output><div id="log-viewport" role="region" aria-label="日志列表" tabindex="0"><div id="log-list"></div></div><button id="log-latest" type="button" hidden="">回到最新</button><details id="log-detail" hidden=""><summary>日志详情</summary><dl></dl><details><summary>JSON</summary><pre data-user-content=""></pre></details></details></section>
<script type="module" src="copilot-panel.mjs"></script>
</body></html>
