<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast-browser-link</title><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="popup.css"></head><body><main class="popup">
<header class="header"><div class="brand-lockup"><img src="brand-logo-small.svg" alt="" width="24" height="24"><strong>Fast-browser-link</strong></div><div class="header-meta"><span id="version-label" aria-label="扩展版本"></span><span id="connection-label" class="st" role="status" aria-label="连接中" aria-live="polite" data-state="connecting"></span></div></header>

<div id="page-task" class="connection-row page-task" hidden=""><span class="row-icon" aria-hidden="true">▣</span><div class="task-copy"><span id="task-title"></span><span id="operation" class="small" role="status"></span></div><div class="page-controls"><button id="takeover" type="button">接管</button><button id="stop-task" class="danger" type="button">停止</button></div><span class="info"><button class="info-button" type="button" aria-label="任务控制说明" aria-describedby="task-info">ⓘ</button><span id="task-info" class="tooltip" role="tooltip" data-zh="只控制当前归属任务页。接管和停止须由本地桥确认；结果未知时不会自动重发。" data-en="Controls apply only to the current task page. Takeover and stop require host confirmation; uncertain commands are never replayed.">只控制当前归属任务页。接管和停止须由本地桥确认；结果未知时不会自动重发。</span></span></div>


<section class="connections" aria-label="连接状态"><div class="connection-row" id="local-row"><span class="row-icon" aria-hidden="true">⌘</span><span class="row-label" data-zh="本地Agent连接" data-en="Local Agent connection">本地Agent连接</span><span id="access-status" class="status-component" role="status" aria-live="polite" data-state="connecting">连接中</span><button id="local-connect" class="small-button" type="button" hidden="" aria-describedby="connection-detail access-detail">连接</button><span class="info"><button class="info-button" type="button" aria-label="本地连接说明" aria-describedby="connection-detail access-detail">ⓘ</button><span class="tooltip" role="tooltip"><span id="connection-detail">确认连接即允许 Fast-browser-link 直接读取、点击和执行任务页脚本，无须逐站或逐项审批。授权仅限任务页；保留接管、停止和任务隔离，密码输入值不回显。</span><span id="access-detail" aria-live="polite">连接状态待确认。</span></span></span></div>

<section class="connection-row copilot-section"><span id="popup-board-name" class="row-label" data-zh="协作" data-en="Assist">协作</span><button id="open-copilot" class="small-button" type="button" data-zh="协作" data-en="Assist" hidden="">协作</button><button id="copilot-toggle" disabled="" class="switch" role="switch" aria-checked="false" aria-label="协作" type="button"><span></span></button></section></section><div id="error-bar" class="error-bar" hidden=""><span id="error" role="alert" hidden=""></span><button id="error-close" class="icon-button" type="button" aria-label="关闭错误提示">×</button></div></main><script type="module" src="popup.mjs"></script>
<footer class="connection-row"><span class="row-label" data-zh="本机产品" data-en="Local products">本机产品</span><button id="open-products" class="small-button" type="button" data-zh="产品连接" data-en="Product connections">产品连接</button></footer>
</body></html>
