<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完成详情 · 协作</title><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="copilot-panel.css"><link rel="stylesheet" href="copilot-result.css"></head>
<body class="full-result">
<dialog id="result-dialog" class="result-modal" aria-labelledby="result-title" aria-describedby="result-context" tabindex="-1">
<div id="work-view">
  <header class="result-window-header">
    <div class="result-window-title">
      <div class="brand-lockup"><img src="brand-logo-small.svg" alt="" width="18" height="18"><span>任务结果</span></div>
      <h1 id="result-title" data-user-content>完成详情</h1>
    </div>
    <div class="result-task-meta"><span id="result-status"></span><span id="result-elapsed">耗时待读取</span><span id="result-tokens" hidden></span></div>
    <button id="result-close" type="button" class="ghost" autofocus aria-label="关闭详情"><span aria-hidden="true">×</span></button>
  </header>
  <div class="result-window-toolbar">
    <nav class="result-tabs" role="tablist" aria-label="完成详情">
      <button id="result-data-tab" type="button" role="tab" aria-controls="result-data-pane" aria-selected="true" tabindex="0">结果</button>
      <button id="result-task-log" type="button" role="tab" aria-controls="result-log-pane" aria-selected="false" tabindex="-1" disabled>日志</button>
    </nav>
    <span id="result-format" class="result-format"></span>
    <details class="result-context-details"><summary id="result-context-label">任务信息</summary><p id="result-context" tabindex="0" data-user-content></p></details>
  </div>
  <p id="notice" role="status" aria-live="polite"></p>
  <section id="result-data-pane" class="result-tab-panel" role="tabpanel" aria-labelledby="result-data-tab" tabindex="0">
    <div id="result-layout" class="result-layout" data-mode="document" data-outline="false">
      <main id="result" aria-busy="true"><p class="empty" role="status">正在读取任务结果…</p></main>
      <details id="result-outline" class="result-outline" hidden><summary id="result-outline-label">内容导航</summary><nav id="result-outline-items" aria-label="结果章节"></nav></details>
    </div>
  </section>
  <section id="result-log-pane" class="result-tab-panel" role="tabpanel" aria-labelledby="result-task-log" tabindex="0" hidden></section>
</div>
</dialog>
<script type="module" src="copilot-result.mjs"></script>
</body></html>
