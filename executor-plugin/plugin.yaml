name: fast-browser-link
version: 2.5.1
manifest_version: 2
api_version: 1
# 中文注释：按宿主钩子能力注册，不用版本号阻止加载。
description: 让 AI agent（Hermes、Codex、Claude Code 等）直接调用已连接的浏览器，执行页面操作、表单填写、上传下载和数据读取；任务授权与清理由 Fast-browser-link 管理。
author: FanJean
license: MIT
tags: [browser, automation, native-messaging, desktop, privacy, python, cookie-mirror]
provides_tools:
  - fast_browser_health
  - fast_browser_browsers
  - fast_browser_create
  - fast_browser_list
  - fast_browser_get
  - fast_browser_artifacts
  - fast_browser_run
  - fast_browser_cancel
  - fast_browser_resume
  - fast_browser_close
  # 中文注释：镜像仅返回站点与计数，用户必须在源扩展确认。
  - fast_browser_cookie_mirror
  - fast_browser_downloads
  - fast_browser_open
  - fast_browser_use_tab
  - fast_browser_script
  - browser_site_search
  - browser_site_manage
  - browser_site_run
  - fast_browser_reference
  - fast_browser_doctor
hooks:
  - pre_tool_call
  # 中文注释：轮次完成启动宽限；中断、会话与子代理结束按实际钩子清理。
  - on_session_finalize
  - subagent_stop
  - on_session_end
  - agent_loop_stopped
provides_hooks:
  - pre_tool_call
  - on_session_finalize
  - subagent_stop
  - on_session_end
  - agent_loop_stopped
python_dependencies: []
external_dependencies: []
# Optional, and never implied by installing: when the operator grants this
# plugin tools.override (Hermes consent flow, or plugins.entries.fast-browser-link
# .allow_tool_override: true), Hermes' official browser_* tools are routed to the
# session's bound native task. Unbound sessions keep Hermes' built-in behavior.
# No Hermes source is patched.
capabilities:
  - tools.override
# 中文注释：Vault 接管需要操作者单独开启；默认关闭。
config_schema:
  vault_tools.enabled:
    type: bool
    default: false
    label: 接管官方 Vault 工具
    description: 默认关闭；启用时还需 tools.override 授权和已就绪的浏览器任务。
